<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>手書きノート</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手書きノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">

  // AI Studio 版：src/shim.js（モジュール）が読み込まれる前に、アプリ本体が待てる入口を用意しておく

<script type="module" src="/src/shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>
<style>
:root{color-scheme:light;
  --desk:#e9e5dc; --paper:#fffdf8; --ink:#23211d; --mute:#7b766c; --line:rgba(70,95,125,.13);
  --acc:#1f5f5b; --acc-soft:#e3efed; --bd:#d9d3c7; --ai:#f5f2fb; --ai-bd:#ddd5ef; --ai-ink:#5b43a8;
}
html,body{margin:0;height:100%}
body{font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:var(--desk);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
input,textarea,select{color:var(--ink);-webkit-text-fill-color:var(--ink);background-color:#fff;caret-color:var(--ink)}
input::placeholder,textarea::placeholder{color:#a8a397;-webkit-text-fill-color:#a8a397;opacity:1}
input:disabled,textarea:disabled{color:#8a857b;-webkit-text-fill-color:#8a857b}
#zoom{display:flex;align-items:center;background:#efebe3;border-radius:12px;padding:3px;flex:none}
#zoom .tb{height:32px;min-width:34px;padding:0 6px;font-size:13px}
#zPct{min-width:52px!important;font-variant-numeric:tabular-nums}
/* toolbar */
#bar{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:10px;padding:6px 10px;background:#faf8f3;border-bottom:1px solid var(--bd);white-space:nowrap;flex:none;scrollbar-width:none;-webkit-user-select:none;user-select:none}
#bar::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:3px;padding-left:8px;margin-left:2px;border-left:1px solid var(--bd)}
.tb{height:38px;min-width:38px;padding:0 9px;border:1px solid transparent;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;flex:none}
.tb:active{background:#ece8df}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb b,.tb i,.tb u{font-size:16px}
.seg{display:flex;background:#efebe3;border-radius:12px;padding:3px;flex:none}
.seg .tb{border-radius:9px;height:34px}
.seg .tb.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--acc);font-weight:700}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd);cursor:pointer;padding:0;flex:none;margin:0 2px}
.sw.on{box-shadow:0 0 0 2.5px var(--acc)}
input[type=range]{width:90px;accent-color:var(--acc)}
.tog{font-size:12.5px;display:flex;align-items:center;gap:4px;color:var(--mute);padding:0 4px}
.tog input{accent-color:var(--acc);width:18px;height:18px}
.tb.ai{color:var(--ai-ink)}
.tb:disabled{opacity:.35;pointer-events:none}
#barL{display:flex;flex-wrap:wrap;gap:6px;row-gap:4px;align-items:center;flex:1;min-width:0}
#barR{display:flex;align-items:center;gap:6px;flex:none}
@media(max-width:1000px){#tabs .tl{display:none}#tabs .tb{padding:0 7px}}
#status{font-size:12px;color:var(--mute);padding:0 6px;flex:none}
.hide{display:none!important}
/* layout */
main{flex:1;display:flex;min-height:0;position:relative}
#side{width:270px;background:#f6f3ec;border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:none;transition:margin-left .2s}
#side.closed{margin-left:-271px}
@media (max-width:1100px){#side{position:absolute;z-index:30;top:0;bottom:0;left:0;box-shadow:4px 0 24px rgba(0,0,0,.14)}}
.side-h{display:flex;align-items:center;padding:12px 12px 8px 16px;gap:8px;font-weight:700}
.side-h .sp{flex:1}
.nl{flex:1;overflow:auto;padding:4px 8px}
.ni{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ni .tx{flex:1;min-width:0}
.ni.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ni .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .s{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .del{opacity:.5;border:none;background:none;font-size:15px;padding:6px;cursor:pointer}
.side-f{font-size:11.5px;color:var(--mute);padding:10px 16px;border-top:1px solid var(--bd);line-height:1.5}
#scroller{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:28px 18px 60px}
/* ---- loose-leaf paper (Campus 理系ドット罫 B5 6mm style) ---- */
#paper{--mm:4.7px;--row:calc(var(--mm)*6);--rule:#86a9c6;
  position:relative;width:860px;margin:0 auto;background:#fdfdfa;border-radius:2px;
  box-shadow:0 1px 2px rgba(0,0,0,.07),0 10px 28px rgba(50,60,80,.10);
  padding:calc(var(--mm)*4) calc(var(--mm)*7) calc(var(--mm)*10) calc(var(--mm)*15);box-sizing:border-box}
#holes{position:absolute;left:0;top:calc(var(--mm)*1.5);bottom:0;width:calc(var(--mm)*11);pointer-events:none;
  background-image:radial-gradient(circle at calc(var(--mm)*6) 50%, var(--desk) 0, var(--desk) calc(var(--mm)*2.6), rgba(0,0,0,.10) calc(var(--mm)*2.6), rgba(0,0,0,.0) calc(var(--mm)*3.1));
  background-size:100% calc(var(--mm)*9.5)}
#ruling{position:absolute;left:calc(var(--mm)*12);right:0;top:calc(var(--mm)*40);pointer-events:none}
#ruling .tri{position:absolute;width:0;height:0;border-left:calc(var(--mm)*1.1) solid transparent;border-right:calc(var(--mm)*1.1) solid transparent;transform:translateX(-50%)}
#ruling .tri.t{top:calc(var(--mm)*-1.8);border-top:calc(var(--mm)*1.6) solid var(--rule)}
#ruling .tri.b{bottom:calc(var(--mm)*-1.8);border-bottom:calc(var(--mm)*1.6) solid var(--rule)}
#hdr{position:absolute;right:calc(var(--mm)*7);top:calc(var(--mm)*4.2);display:flex;align-items:flex-end;gap:calc(var(--mm)*2);color:var(--rule);font-size:calc(var(--mm)*2.6);font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:.04em}
#hdr .f{display:inline-block;min-width:calc(var(--mm)*14);border-bottom:1px solid var(--rule);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;font-size:calc(var(--mm)*3);outline:none;text-align:center;padding:0 2px;line-height:1.3}
#hdr .f.no{min-width:calc(var(--mm)*10)}
#hdr .f:empty::before{content:attr(data-ph);color:#b8c9d8}
#title,#subtitle,#body{position:relative;z-index:1}
#head{position:relative;z-index:1;margin:0 calc(var(--mm)*-7) calc(var(--mm)*3) calc(var(--mm)*-3);padding:0 calc(var(--mm)*7) 0 calc(var(--mm)*3)}
#title{font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif;font-size:calc(var(--mm)*7.6);font-weight:700;line-height:1.3;outline:none;min-height:calc(var(--mm)*10);padding:calc(var(--mm)*7) 0 calc(var(--mm)*2.5);box-shadow:0 1.5px 0 var(--rule)}
#subtitle{font-size:calc(var(--mm)*4.6);line-height:1.45;color:#4f5c69;outline:none;min-height:calc(var(--mm)*6.7);padding:calc(var(--mm)*1.8) 0 calc(var(--mm)*1.5)}
[data-ph]:empty::before{content:attr(data-ph);color:#bfc6cd}
#body{font-size:calc(var(--row)*.6);line-height:var(--row);outline:none;min-height:calc(var(--row)*14)}
#body.ph::before{content:"本文を入力…（ペンやマーカーで手書きもできます）";position:absolute;top:0;left:0;color:#bfc6cd;pointer-events:none}
#body p,#body > div{margin:0}
#body h2{font-size:1.25em;line-height:var(--row);margin:0}
#body h3{font-size:1.12em;line-height:var(--row);margin:0}
#body blockquote{margin:0;padding-left:.8em;border-left:3px solid var(--acc);color:#4a463f}
#body ul,#body ol{margin:0;padding-left:1.6em}
#body hr{border:none;border-top:1px dashed #9fb3c4;margin:calc(var(--row)/2 - .5px) 0}
#body .blk{margin-top:calc(var(--row)/2);margin-bottom:calc(var(--row)/2)}
#body .formula{font-family:"STIX Two Math","Times New Roman",serif;background:#f7f5ef;padding:0 8px;border-radius:6px}
#cvM,#cvP{position:absolute;left:0;top:0;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cvM{opacity:.42;mix-blend-mode:multiply;z-index:2}
#cvP{z-index:3}
body.drawing #cvP{pointer-events:auto;touch-action:none;cursor:crosshair}
#selLayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
#selLayer .lasso{fill:rgba(47,95,168,.06);stroke:#2f5fa8;stroke-width:1.2;stroke-dasharray:5 4}
#selLayer .hl{fill:none;stroke:#3d7be0;stroke-opacity:.35;stroke-linecap:round;stroke-linejoin:round}
#selLayer .box{fill:none;stroke:#2f5fa8;stroke-width:1.2;stroke-dasharray:6 4}
#selLayer .hdl{fill:#fff;stroke:#2f5fa8;stroke-width:1.5}
body.m-select #cvP{cursor:default}
#gSel .tb:disabled{opacity:.4}
body.drawing #paper{-webkit-user-select:none;user-select:none}
#more{display:block;margin:14px auto 0}
/* blocks */
.blk{margin:16px 0;border:1px solid var(--bd);border-radius:12px;background:#fff;padding:12px 14px;line-height:1.65;position:relative}
.blk-head{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-bottom:8px;-webkit-user-select:none;user-select:none;flex-wrap:wrap}
.blk-head .lab{font-weight:700;letter-spacing:.04em}
.blk-head .sp{flex:1}
.bb{font-size:12.5px;border:1px solid var(--bd);background:#faf8f3;border-radius:8px;padding:6px 10px;cursor:pointer;line-height:1.2}
.bb.ai{color:var(--ai-ink);border-color:var(--ai-bd);background:var(--ai)}
.blk img.main{max-width:100%;display:block;margin:0 auto;border-radius:6px}
.blk figcaption{font-size:14px;color:#6c675d;text-align:center;margin-top:6px;outline:none;min-height:1.4em}
.blk figcaption:empty::before{content:"キャプションを入力";color:#c9c3b8}
.chartbox{position:relative;height:320px}
.blk table{border-collapse:collapse;width:100%;font-size:14.5px}
.blk th,.blk td{border:1px solid #ddd6c8;padding:6px 8px;text-align:left;vertical-align:top;outline:none}
.blk th{background:#f4f1ea}
.tblwrap{overflow-x:auto}
.blk.ai{background:var(--ai);border-color:var(--ai-bd)}
.blk.cite{border-left:4px solid var(--acc)}
.cite-src{font-size:15px;font-weight:700;word-break:break-all}
.cite-src a{color:var(--acc)}
.cite-meta{font-size:12px;color:var(--mute)}
.cite blockquote{margin:8px 0;padding:8px 12px;background:#f7f5ef;border-radius:8px;font-size:15px;white-space:pre-wrap;border-left:3px solid #c9c2b2}
.an h4{margin:10px 0 4px;font-size:12.5px;color:var(--acc);letter-spacing:.06em}
.blk.ai .an h4{color:var(--ai-ink)}
.an p{margin:0;font-size:15px}
.an ul{margin:2px 0;padding-left:1.3em;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{background:#fff;border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-size:13px}
.comp{margin-top:6px}
.comp .cn{font-size:12px;font-weight:700;color:#5d584f}
.mm svg{max-width:100%;height:auto;display:block;margin:0 auto}
.ttl{font-weight:700;font-size:15px;margin-bottom:6px;text-align:center}
.cap{font-size:12.5px;color:var(--mute);margin-top:6px;text-align:center}
.err{color:#a23b2a;font-size:13px}
/* 本文中のブロックは紙の大きさ（mm）に比例させる：拡大率や画面幅が変わっても、ブロックの高さが紙と同じ比率で変わり、下の文字・手書き・白塗りがずれない */
#body .blk{font-size:calc(var(--mm)*3.6);padding:.7em .82em;border-radius:.7em;line-height:1.65;border:none;box-shadow:inset 0 0 0 1px var(--bd)}
#body .blk.ai{box-shadow:inset 0 0 0 1px var(--ai-bd)}
#body .blk.cite{box-shadow:inset 4px 0 0 var(--acc),inset 0 0 0 1px var(--bd)}
#body .blk-head{font-size:.7em;gap:.5em;margin-bottom:.67em}
#body .blk .bb{font-size:1.04em;padding:.48em .8em;border-radius:.64em}
#body .blk img.main{width:100%;max-width:none;height:auto;border-radius:.35em}
#body .blk figcaption{font-size:.82em;margin-top:.43em}
#body .blk .chartbox{height:18.8em}
#body .blk table{font-size:.85em}
#body .blk th,#body .blk td{padding:.41em .55em;border:none;box-shadow:inset -1px -1px 0 #ddd6c8}
#body .blk table{box-shadow:inset 1px 1px 0 #ddd6c8}
#body .cite-src{font-size:.88em}
#body .cite-meta{font-size:.7em}
#body .cite blockquote{margin:.55em 0;padding:.53em .8em;font-size:.88em;border-radius:.53em}
#body .an h4{margin:.8em 0 .32em;font-size:.74em}
#body .an p,#body .an ul{font-size:.88em}
#body .an ul{margin:.13em 0}
#body .chips{gap:.35em;margin:.24em 0}
#body .chip{font-size:.76em;padding:.15em .77em}
#body .comp{margin-top:.35em}
#body .comp .cn{font-size:.7em}
#body .mm svg{width:100%;max-width:none;height:auto}
#body .ttl,#body .title2{font-size:.88em;margin-bottom:.4em}
#body .cap{font-size:.74em;margin-top:.48em}
#body .err{font-size:.76em}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,25,15,.38);display:flex;align-items:center;justify-content:center;z-index:350;padding:14px}
.md{background:#fffdf8;border-radius:16px;width:min(660px,100%);max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.md.wide{width:min(1120px,100%)}
.md-h{padding:14px 18px;font-weight:700;border-bottom:1px solid var(--bd);display:flex;align-items:center}
.md-h .sp{flex:1}
.md-h .x{border:none;background:none;font-size:22px;cursor:pointer;padding:0 6px;color:var(--mute)}
.md-b{padding:16px 18px;overflow:auto;flex:1}
.md-f{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.md-f .note{margin-right:auto;font-size:12px;color:var(--mute)}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-size:15px;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.ai{background:var(--ai-ink);color:#fff;border-color:var(--ai-ink)}
.btn:disabled{opacity:.45}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.fld input[type=text],.fld input[type=url],.fld textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.fld textarea{min-height:110px;resize:vertical}
.hint{font-size:12.5px;color:var(--mute);line-height:1.6;margin:-4px 0 12px}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.checks label{display:flex;align-items:center;gap:6px}
.checks input{width:18px;height:18px;accent-color:var(--acc)}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ex button{font-size:13px;border:1px solid var(--bd);background:#f6f3ec;border-radius:999px;padding:6px 11px;cursor:pointer}
.prev{border:1px dashed var(--bd);border-radius:12px;padding:12px;margin-top:8px;background:#fff}
/* right panel */
#tabs{margin-left:4px}
#tabs .tb{font-size:13.5px;padding:0 8px}
#panel{width:400px;background:#f8f6f1;border-left:1px solid var(--bd);display:flex;flex-direction:column;flex:none;min-height:0}
#panel.closed{display:none}
#panel{position:relative}
#pnResize{position:absolute;left:-7px;top:0;bottom:0;width:14px;z-index:5;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
#pnResize span{width:5px;height:44px;border-radius:3px;background:#cfc8bb;box-shadow:0 0 0 2px #f8f6f1;transition:background .15s}
#pnResize:hover span,#pnResize.on span{background:var(--acc)}
body.pn-resizing{cursor:col-resize;-webkit-user-select:none;user-select:none}
@media(max-width:1100px){#panel{position:absolute;z-index:31;top:0;bottom:0;right:0;width:min(420px,94vw);box-shadow:-4px 0 24px rgba(0,0,0,.16)}}
.pn-h{display:flex;align-items:center;padding:12px 14px;font-weight:700;border-bottom:1px solid var(--bd);font-size:15px}
.pn-h .sp{flex:1}
.pn-h .x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--mute);padding:0 4px}
.pn-b{flex:1;overflow:auto;padding:12px 14px 40px;-webkit-overflow-scrolling:touch}
.pn-b .row input[type=url]{flex:1;min-width:0}
.pn-b input[type=url],.pn-b input[type=text],.pn-b textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.pn-b textarea{min-height:110px}
.pn-b .btn{height:40px;font-size:14px}
.pn-b .seg .tb{height:32px;font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card.ai{background:var(--ai);border-color:var(--ai-bd)}
.card .ct{font-weight:700;font-size:14.5px;line-height:1.5}
.card .cm,.cm{font-size:12px;color:var(--mute);word-break:break-all}
.card .cm a{color:var(--acc)}
.card .cs{font-size:13.5px;margin-top:6px;line-height:1.65}
.card details summary,details.paste summary{font-size:12.5px;color:var(--acc);cursor:pointer;margin-top:6px}
details.paste{margin-bottom:10px}
.card input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);margin-top:2px;flex:none}
.srcText{white-space:pre-wrap;font-size:12.5px;max-height:300px;overflow:auto;background:#faf8f3;padding:8px;border-radius:8px;margin-top:6px;line-height:1.6}
.q{margin:6px 0 0;padding:6px 10px;background:#f4f1ea;border-left:3px solid #c9c2b2;border-radius:6px;font-size:13px;white-space:pre-wrap}
.empty{color:var(--mute);font-size:13.5px;line-height:1.7;padding:10px 2px}
/* masks (白塗り) */
.mask{border-radius:3px;padding:0 2px;margin:0 1px;color:transparent;background:#fff;box-shadow:inset 0 0 0 1.5px #4a4f55;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mask[data-c=b]{background:#23262a;box-shadow:inset 0 0 0 1.5px #23262a}
body.m-mask .mask{color:rgba(30,30,30,.38)}
body.m-mask .mask[data-c=b]{color:rgba(255,255,255,.6)}
body.m-mask #body{cursor:pointer}
body.m-check .mask.open{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px #4a4f55}
body.m-check .mask.wrong{box-shadow:inset 0 0 0 2px #d23b3b,0 0 0 3px rgba(210,59,59,.28)}

.xsplit{flex:1;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);min-height:0;height:100%}

.sh-p{font-weight:700;font-size:14px;margin:14px 0 2px;padding:3px 8px;background:#f1eee6;border-radius:6px}
.srow{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;align-items:start;padding:9px 4px;border-bottom:1px solid #e3ded2}
.srow.cur{background:#f4f8ff}
.srow .snum{font-weight:700;padding-top:9px;white-space:nowrap}
.srow.done .snum{color:#2f5fa8}
.symrow{display:flex;flex-wrap:wrap;gap:6px}
.symb{min-width:44px;height:44px;border:1.5px solid var(--bd);border-radius:50%;background:#fff;font:inherit;font-size:18px;cursor:pointer;color:#222;padding:0}
.symrow.wide .symb{min-width:40px;height:40px;font-size:16px}
.symb.sel{background:#2f5fa8;border-color:#2f5fa8;color:#fff}
.symrow.tf .symb{min-width:52px;font-size:22px}
.fixrow{display:flex;align-items:center;gap:6px;margin-top:8px}
.fixrow .fx-l{white-space:nowrap}
.fx-n{margin-top:2px;font-size:11.5px}
.qz-in.sm{font-size:16px;padding:8px 10px;border-radius:9px;margin-top:0}
.qz-ta.sm{min-height:90px;font-size:15px;margin-top:0;border-radius:9px}
.xsheet .calc-work{min-height:56px}
.pq.cur{box-shadow:0 0 0 2px #2f5fa8}
.pch{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pch-i{display:flex;gap:10px;font-size:16px;line-height:1.6}
.pch-i .sym,.wbank .sym{font-weight:700;color:#2f5fa8;flex:none}
.wbank .chip .sym{margin-right:4px}
@media(max-width:760px){.xsplit{grid-template-columns:1fr;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr)}.xsheet{border-left:0;border-top:2px solid #c9c2b2}}

<script>
'use strict';
/* ========== utilities ========== */
// append(null / false) を無視する（条件付きの子要素を書きやすくするため）
{ const ap = Element.prototype.append; Element.prototype.append = function (...k) { return ap.apply(this, k.filter(x => x != null && x !== false)); }; }
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
const uid = (p = 'n') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastT = 0;
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
const fmtDate = ts => { const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function storageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storageSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
function storageDel(k) { try { localStorage.removeItem(k); } catch {} }

/* ========== capabilities ========== */
async function cap(n) {
  // 公開版：自前サーバー（Cloudflare Workers）があればそちらを使う
  if (window.__inknote) {
    if (await window.__inknote.ready) { try { return await window.__inknote.use(n); } catch { return null; } }
  }
  for (let i = 0; i < 30 && !(window.claude && typeof window.claude.use === 'function'); i++) await sleep(100);
  if (!(window.claude && typeof window.claude.use === 'function')) return null;
  try { return await window.claude.use(n); } catch { return null; }
}
let sample = null, assets = null, imgAI = false;
cap('sample').then(async s => {
  sample = s;
  if (s) { try { const l = typeof s.limits === 'function' ? await s.limits() : null; imgAI = l ? !!l.images : true; } catch { imgAI = true; } }
  updateAIButtons();
});
cap('assets').then(a => { assets = a; });

/* ========== storage ========== */
async function retry(fn) {
  try { return await fn(); }
  catch (e) { if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 700); return fn(); } throw e; }
}
// クラウド保存から届くデータは凍結（変更不可）されているため、必ず複製してから使う
const dc = v => v == null ? v : JSON.parse(JSON.stringify(v));
const Store = {
  mode: 'local', col: null, inkParts: {},
  async init() {
    const [db, user] = await Promise.all([cap('db'), cap('user')]);
    if (db && user) {
      let id = null; try { id = await user.id(); } catch {}
      if (id) { this.col = db.collection('data/users/' + id); this.mode = 'cloud'; }
    }
  },
  async list() {
    if (this.mode === 'cloud') {
      const snap = await retry(() => this.col.where('kind', '==', 'note').get());
      return snap.docs.map(d => dc(d.data())).filter(Boolean).map(d => ({ id: d.id, title: d.title, subtitle: d.subtitle, updated: d.updated }));
    }
    try { return JSON.parse(storageGet('inknote:index') || '[]'); } catch { return []; }
  },
  async load(id) {
    if (this.mode === 'cloud') {
      const [n, ink] = await Promise.all([
        retry(() => this.col.doc(id).get()),
        retry(() => this.col.where('note', '==', id).where('kind', '!=', 'exam').get())

/* ========== 書き出し・読み込み（このアプリ専用のバックアップ形式） ========== */
let downloadsCap = null;
cap('downloads').then(d => { downloadsCap = d; });
const BK_FORMAT = 'inknote-backup';
const blobUrls = text => [...new Set(String(text).match(/\/_blob\/[^"'\s)\\<>]+/g) || [])];
// 先頭のバイト列から画像の種類を判定（サーバーが正しい種類を返さない場合に備える）
function sniffImage(a) {
  if (a[0] === 0xFF && a[1] === 0xD8 && a[2] === 0xFF) return 'image/jpeg';
  if (a[0] === 0x89 && a[1] === 0x50 && a[2] === 0x4E && a[3] === 0x47) return 'image/png';
  if (a[0] === 0x47 && a[1] === 0x49 && a[2] === 0x46) return 'image/gif';
  if (a[0] === 0x52 && a[1] === 0x49 && a[2] === 0x46 && a[3] === 0x46 && a[8] === 0x57 && a[9] === 0x45 && a[10] === 0x42 && a[11] === 0x50) return 'image/webp';
  const box = String.fromCharCode(...a.slice(4, 12));
  if (/^ftyp(heic|heix|mif1|msf1)/.test(box)) return 'image/heic';
  if (/^ftypavi[fs]/.test(box)) return 'image/avif';
  const head = String.fromCharCode(...a.slice(0, 256)).trimStart();
  if (/^<\?xml|^<svg/i.test(head) && /<svg/i.test(head)) return 'image/svg+xml';
  return '';
}
async function asImageBlob(b) {
  if (/^image\//.test(b.type)) return b;
  const t = sniffImage(new Uint8Array(await b.slice(0, 256).arrayBuffer()));
  return t ? new Blob([b], { type: t }) : b;
}
// data: URL を Blob に（fetch を使わない。claude.ai の表示では data: への fetch が禁止されているため）
function dataURLToBlob(u) {
  const i = u.indexOf(','), meta = u.slice(5, i);
  const raw = /;base64/i.test(meta) ? atob(u.slice(i + 1)) : decodeURIComponent(u.slice(i + 1));
  const a = new Uint8Array(raw.length); for (let k = 0; k < raw.length; k++) a[k] = raw.charCodeAt(k);
  return new Blob([a], { type: sniffImage(a) || meta.split(';')[0] || 'application/octet-stream' });
}
// 書き出し用に画像を取得。fetch できない場合は表示用の <img> から描き直す
async function fetchAsset(url) {
  try { const r = await fetch(url); if (r.ok) return await asImageBlob(await r.blob()); } catch (e) { console.warn('asset fetch', url, e); }
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return canvasToBlob(c, 'image/png');
}
async function gatherNote(id) {
  const { note, ink, srcs: ss, panel, aux } = await Store.load(id);
  if (!note) return null;
  const st = (aux && aux.study) || null;
  const exams = [];
  for (const sum of (st && st.exams) || []) {
    let ex = (sum.questions || (sum.parts && sum.parts[0] && sum.parts[0].questions)) ? sum : null;
    if (!ex) { try { ex = await Store.loadExam(id, sum.id); } catch {} }
    if (ex) exams.push(ex);
  }
  return { note, ink: ink || [], srcs: ss || [], panel: panel || null, study: st, exams };
}
async function exportNotes(ids, label) {
  if (!downloadsCap) { modal({ title: '書き出しできません', body: h('div', { text: 'この表示ではファイルを保存できません。' }), actions: [{ label: '閉じる' }] }); return; }
  const b = busy('書き出すデータを集めています…');
  let file;
  try {
    await flush(); await saveChain; await pnChain;
    const notesOut = [];
    for (const id of ids) { const g = await gatherNote(id); if (g) notesOut.push(g); }
    if (!notesOut.length) { toast('書き出すノートがありません'); return; }
    // 画像（アップロード済みのもの）はファイルの中に埋め込む
    const text0 = JSON.stringify(notesOut);
    const assetsOut = {};
    const urls = blobUrls(text0);
    for (let i = 0; i < urls.length; i++) {
      $('#busyTx').textContent = `画像を埋め込み中…（${i + 1}/${urls.length}）`;
      try { assetsOut[urls[i]] = await blobToDataURL(await fetchAsset(urls[i])); } catch (e) { console.warn('asset', urls[i], e); }
    }
    const missed = urls.length - Object.keys(assetsOut).length;
    if (missed) toast(`画像 ${missed} 件を書き出しに含められませんでした`, 5000);
    file = JSON.stringify({ format: BK_FORMAT, version: 1, app: '手書きノート', exportedAt: new Date().toISOString(), notes: notesOut, assets: assetsOut });
  } catch (e) { console.error(e); toast('書き出しの準備に失敗しました: ' + (e && e.message || e), 5000); return; }
  finally { b.done(); }
  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const safe = String(label || 'ノート').replace(/[\\/:*?"<>|\n\r\t]/g, '_').slice(0, 60);
  try {
    await downloadsCap.save({ filename: `${safe}_${ymd}.inknote.json`, data: new Blob([file], { type: 'application/json' }) });
    toast('書き出しました');
  } catch (e) {
    const c = e && e.code;
    if (c === 'declined') toast('保存を取りやめました');
    else if (c === 'rate_limited') toast('保存の確認がすでに開いています。少し待ってからもう一度お試しください');
    else toast('保存できませんでした（' + (c || e) + '）', 5000);

}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('ファイルを読み込めませんでした（形式が違います）', 5000); return; }
  if (!data || data.format !== BK_FORMAT || !Array.isArray(data.notes)) { toast('このアプリで書き出したファイルではありません', 5000); return; }
  const names = data.notes.map(n => (n.note && n.note.title) || '無題のノート');
  const md = modal({ title: 'ノートを読み込む', body: h('div', null,
    h('div', { text: `${data.notes.length}件のノートを読み込みます。` }),
    h('ul', { style: 'margin:8px 0;padding-left:1.3em;font-size:14px' }, names.slice(0, 12).map(n => h('li', { text: n })), names.length > 12 ? h('li', { text: `ほか ${names.length - 12} 件` }) : null),
    h('div', { class: 'hint', text: '同じノートがすでにある場合は、上書きせずに「（読み込み）」を付けた別のノートとして追加します。' })),
    actions: [{ label: 'キャンセル' }, { label: '読み込む', cls: 'pri', onClick: () => { md.close(); doImport(data); } }] });
}
async function doImport(data) {
  const b = busy('読み込み中…');
  let lastId = null, count = 0;
  try {
    await flush(); await saveChain;
    // 埋め込まれた画像を、この環境に保存し直して参照を置き換える
    let text = JSON.stringify(data.notes);
    // 長いURLから順に置き換える（短いURLが長いURLの先頭と一致して壊れるのを防ぐ）
    const entries = Object.entries(data.assets || {}).sort((a, b) => b[0].length - a[0].length);
    let failed = 0, inlined = 0; const fresh = new Set();
    for (let i = 0; i < entries.length; i++) {
      const [oldUrl, dataUrl] = entries[i];
      $('#busyTx').textContent = `画像を取り込み中…（${i + 1}/${entries.length}）`;
      try {
        const st = await storeImage(dataURLToBlob(dataUrl));
        if (!st.asset) inlined++; else fresh.add(st.src);
        text = text.split(oldUrl).join(st.src);
      } catch (e) { failed++; console.warn('asset import', e); }
    }
    const lost = blobUrls(text).filter(u => !fresh.has(u) && !(data.assets || {})[u]).length;
    if (failed || lost) setTimeout(() => toast(`画像 ${failed + lost} 件を取り込めませんでした` + (lost ? '（書き出したファイルに画像が含まれていません）' : ''), 6000), 1500);
    else if (inlined) setTimeout(() => toast(`画像 ${inlined} 件はサーバーに保存できなかったため、ノートの中に直接保存しました`, 6000), 1500);
    const notesIn = JSON.parse(text);
    const existing = new Set(notes.map(n => n.id));
    for (const g of notesIn) {
      if (!g || !g.note) continue;
      const n = g.note;
      if (existing.has(n.id)) { n.id = uid('n'); n.title = (n.title || '無題のノート') + '（読み込み）'; if (n.pages && n.pages[0]) n.pages[0].title = n.title; }
      n.kind = 'note'; n.updated = Date.now();
      $('#busyTx').textContent = `ノートを保存中…（${count + 1}/${notesIn.length}）「${n.title || '無題のノート'}」`;
      Store.inkParts[n.id] = 0;
      await Store.saveNote(n);
      if (g.ink && g.ink.length) await Store.saveInk(n.id, g.ink);
      for (const s of g.srcs || []) await Store.saveSource(n.id, s);
      if (g.panel) await Store.savePanel(n.id, g.panel);
      if (g.study) {
        const st = g.study;
        st.exams = (st.exams || []).map(x => (x.questions || (x.parts && x.parts[0] && x.parts[0].questions)) ? examSummary(x) : x);
        await Store.saveAux(n.id, 'study', st);
      }
      for (const ex of g.exams || []) await Store.saveExam(n.id, ex);
      existing.add(n.id); updateMeta(n); lastId = n.id; count++;
    }
  } catch (e) { console.error(e); toast('読み込みに失敗しました: ' + (e && e.message || e), 5000); }
  finally { b.done(); }
  if (lastId) { await openNote(lastId); renderList(); toast(`${count}件のノートを読み込みました`); }
}
